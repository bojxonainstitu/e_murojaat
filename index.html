<body class="on-landing">
<a class="skip-link" href="#stage">↓</a>

<!-- ============================ TITUL VARAQ (LANDING) ============================ -->
<section id="landing" class="landing no-print" aria-labelledby="landTitle">
  <svg class="girih" aria-hidden="true" width="100%" height="100%">
    <defs>
      <pattern id="girihTile" width="96" height="96" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="currentColor" stroke-width="1.1">
          <rect x="24" y="24" width="48" height="48"/>
          <rect x="24" y="24" width="48" height="48" transform="rotate(45 48 48)"/>
          <circle cx="48" cy="48" r="10"/>
          <path d="M0 0 L24 24 M96 0 L72 24 M0 96 L24 72 M96 96 L72 72 M48 0 V14 M48 96 V82 M0 48 H14 M96 48 H82"/>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#girihTile)"/>
  </svg>

  <svg class="arch-art" viewBox="0 0 640 720" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">
    <defs>
      <linearGradient id="gTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0D9488"/></linearGradient>
      <linearGradient id="gIndigo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b44b8"/><stop offset="1" stop-color="#312E81"/></linearGradient>
      <pattern id="archTile" width="22" height="22" patternUnits="userSpaceOnUse">
        <path d="M11 2 L20 11 L11 20 L2 11 Z" fill="none" stroke="#7d78e0" stroke-width="1" opacity=".55"/>
      </pattern>
    </defs>
    <polygon class="band band-navy" points="640,0 640,720 120,720 520,0" fill="#0F172A"/>
    <polygon class="band band-teal" points="640,250 640,720 330,720" fill="url(#gTeal)" opacity=".95"/>
    <line class="gold-line gl1" x1="80" y1="720" x2="560" y2="0" stroke="#D4AF37" stroke-width="2.5"/>
    <line class="gold-line gl2" x1="250" y1="720" x2="640" y2="140" stroke="#D4AF37" stroke-width="2"/>
    <g class="arch-group">
      <path class="arch a1" d="M110 720 V320 C110 205 205 140 320 52 C435 140 530 205 530 320 V720" fill="none" stroke="url(#gIndigo)" stroke-width="34"/>
      <path class="arch a1p" d="M110 720 V320 C110 205 205 140 320 52 C435 140 530 205 530 320 V720" fill="none" stroke="url(#archTile)" stroke-width="34"/>
      <path class="arch a2" d="M150 720 V330 C150 230 230 170 320 95 C410 170 490 230 490 330 V720" fill="none" stroke="#D4AF37" stroke-width="3"/>
      <path class="arch a3" d="M172 720 V338 C172 245 245 190 320 125 C395 190 468 245 468 338 V720" fill="none" stroke="url(#gTeal)" stroke-width="26"/>
      <path class="arch a4" d="M204 720 V350 C204 270 262 222 320 172 C378 222 436 270 436 350 V720" fill="none" stroke="#312E81" stroke-width="18"/>
      <path class="arch a5" d="M226 720 V360 C226 290 274 250 320 210 C366 250 414 290 414 360 V720" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
      <path class="arch-door" d="M240 720 V372 C240 312 282 276 320 244 C358 276 400 312 400 372 V720 Z" fill="#0F172A"/>
      <g class="door-star" transform="translate(320 330)">
        <rect x="-26" y="-26" width="52" height="52" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
        <rect x="-26" y="-26" width="52" height="52" fill="none" stroke="#14b8a6" stroke-width="2.5" transform="rotate(45)"/>
        <circle r="9" fill="#D4AF37"/>
      </g>
      <path class="arch-inner" d="M262 720 V560 C262 520 292 498 320 476 C348 498 378 520 378 560 V720" fill="none" stroke="url(#gTeal)" stroke-width="14"/>
    </g>
  </svg>

  <div class="landing-top">
    <img class="land-logo" src="assets/logo-mark.png" alt="E-murojat" width="74" height="85">
    <div data-lang-switch></div>
  </div>

  <div class="landing-grid">
    <div class="landing-content">
      <h1 id="landTitle" class="land-title" aria-label="E-murojat"><span class="lt">E-murojat</span></h1>
      <p class="land-tagline" data-i18n="land.tagline"></p>
      <p class="land-lead" data-i18n="land.lead"></p>
      <div class="land-actions">
        <button type="button" id="btnStart" class="btn-cta">
          <span class="cta-ico" aria-hidden="true">✉</span>
          <span data-i18n="land.cta"></span>
          <span class="cta-arrow" aria-hidden="true">→</span>
        </button>
      </div>
      <p class="land-note" data-i18n="land.note"></p>
      <ul class="land-features">
        <li><span class="fi" aria-hidden="true">🏛</span><div><b data-i18n="land.f1t"></b><small data-i18n="land.f1d"></small></div></li>
        <li><span class="fi" aria-hidden="true">🛡</span><div><b data-i18n="land.f2t"></b><small data-i18n="land.f2d"></small></div></li>
        <li><span class="fi" aria-hidden="true">📄</span><div><b data-i18n="land.f3t"></b><small data-i18n="land.f3d"></small></div></li>
      </ul>
    </div>
  </div>
</section>

<!-- ============================ ILOVA (ISHCHI OYNA) ============================ -->
<div id="appShell" class="app-shell" hidden>
<header class="site-header no-print">
  <div class="wrap header-inner">
    <div class="brand">
      <button type="button" id="btnHome" class="logo" data-i18n-aria="hdr.home" data-i18n-title="hdr.home">
        <img src="assets/logo-mark.png" alt="" width="40" height="46">
      </button>
      <div class="brand-text">
        <div class="brand-name">E-murojat</div>
        <div class="brand-sub" data-i18n="hdr.sub"></div>
      </div>
    </div>
    <div class="header-right">
      <div data-lang-switch data-variant="dark"></div>
    </div>
  </div>
  <div class="wrap demo-bar">
    <button type="button" id="btnHome2" class="btn demo home-btn">← <span data-i18n="hdr.home"></span></button>
    <span class="demo-label" data-i18n="demo.label"></span>
    <button type="button" class="btn demo" data-demo="ishhaqi" data-i18n="demo.ishhaqi"></button>
    <button type="button" class="btn demo" data-demo="tovar" data-i18n="demo.tovar"></button>
    <button type="button" class="btn demo danger" data-demo="chala" data-i18n="demo.chala"></button>
  </div>
</header>

<main class="wrap flow">
  <nav id="stepper" class="stepper no-print"></nav>
  <div id="stage" class="stage" tabindex="-1"></div>
</main>

<footer class="site-footer no-print">
  <div class="wrap">
    <p class="disclaimer" data-i18n="foot.disclaimer"></p>
    <p class="foot-small" data-i18n-html="foot.links"></p>
  </div>
</footer>
</div><!-- /#appShell -->

<div id="toasts" class="toasts no-print" aria-live="polite"></div>
